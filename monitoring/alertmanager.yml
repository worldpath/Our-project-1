# Enhanced Trading Bot - AlertManager Configuration
# ================================================

global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'trading-bot@yourdomain.com'

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
  - match:
      severity: critical
    receiver: 'critical-alerts'
  - match:
      severity: warning
    receiver: 'warning-alerts'

receivers:
- name: 'web.hook'
  webhook_configs:
  - url: 'http://enhanced-trading-bot:8080/alerts/webhook'

- name: 'critical-alerts'
  email_configs:
  - to: '${ALERT_EMAIL}'
    subject: '🚨 CRITICAL: Trading Bot Alert'
    body: |
      Alert: {{ .GroupLabels.alertname }}
      Summary: {{ .CommonAnnotations.summary }}
      Description: {{ .CommonAnnotations.description }}
  
  webhook_configs:
  - url: 'http://enhanced-trading-bot:8080/alerts/critical'
    
- name: 'warning-alerts'
  email_configs:
  - to: '${ALERT_EMAIL}'
    subject: '⚠️ WARNING: Trading Bot Alert'
    body: |
      Alert: {{ .GroupLabels.alertname }}
      Summary: {{ .CommonAnnotations.summary }}
      Description: {{ .CommonAnnotations.description }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']