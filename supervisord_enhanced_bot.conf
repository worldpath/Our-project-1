[supervisord]
nodaemon=false
logfile=/home/user/webapp/supervisord_enhanced.log
pidfile=/home/user/webapp/supervisord_enhanced.pid

[unix_http_server]
file=/home/user/webapp/supervisor_enhanced.sock

[supervisorctl]
serverurl=unix:///home/user/webapp/supervisor_enhanced.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:enhanced_crypto_bot]
command=python3 /home/user/webapp/start_enhanced_bot.py
directory=/home/user/webapp
autostart=true
autorestart=true
stdout_logfile=/home/user/webapp/enhanced_bot.log
stderr_logfile=/home/user/webapp/enhanced_bot_error.log
environment=PYTHONPATH="/home/user/webapp:/home/user/webapp/bot_enhancements"