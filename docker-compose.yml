version: "3.9"

services:
  bot:
    build: .
    container_name: crypto-bot
    env_file: [.env]
    # Keep code in the image; only persist data under /app/data
    volumes:
      - ./data:/app/data
    # Explicit absolute path so we never depend on $PWD
    command: bash -lc "python /app/run_live.py"
    restart: unless-stopped
    # Healthcheck: ensures risk_state or trade_history updated recently
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck_bot.py"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 3m
    # Set defaults so you don't need to edit .env right now
    environment:
      # Where logs/state go (the mounted host directory)
      TRADE_LOG_FILE: "/app/data/trade_history.csv"
      RISK_STATE_PATH: "/app/data/risk_state.json"
      # Health thresholds (adjust if you like)
      BOT_HEALTH_MAX_STALE_MIN: "45"
    depends_on:
      - dashboard
    networks: [ botnet ]

  dashboard:
    build: .
    container_name: crypto-dashboard
    env_file: [.env]
    volumes:
      - ./data:/app/data
    command: bash -lc "python /app/dashboard/run_dashboard.py"
    expose: [ "8000" ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck_dashboard.py"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 1m
    networks: [ botnet ]

  caddy:
    image: caddy:2.8
    container_name: crypto-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard
    networks: [ botnet ]

  watchdog:
    image: python:3.11-slim
    container_name: crypto-watchdog
    env_file: [.env]
    # Has to see the data files and Docker socket
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/watchdog.py:/watchdog.py:ro
    command: ["python", "/watchdog.py"]
    restart: unless-stopped
    environment:
      WATCHDOG_INTERVAL_SEC: "60"
      WATCHDOG_MAX_STALE_MIN: "60"
      BOT_CONTAINER_NAME: "crypto-bot"
      DASH_CONTAINER_NAME: "crypto-dashboard"
    depends_on:
      - bot
      - dashboard
    networks: [ botnet ]

volumes:
  caddy_data: {}
  caddy_config: {}

networks:
  botnet:
    driver: bridge
