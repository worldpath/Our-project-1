
version: "3.9"
services:

bot:
  build: .
  container_name: crypto-bot
  healthcheck:
    test: ["CMD", "python", "scripts/healthcheck_bot.py"]
    interval: 2m
    timeout: 10s
    retries: 3
    start_period: 3m

    env_file: [.env]
    command: bash -lc "python run_live.py"
    restart: unless-stopped
    volumes: [ "./data:/app" ]
    depends_on: [ dashboard ]
    networks: [ botnet ]


dashboard:
  build: .
  container_name: crypto-dashboard
  healthcheck:
    test: ["CMD", "python", "scripts/healthcheck_dashboard.py"]
    interval: 2m
    timeout: 10s
    retries: 3
    start_period: 1m

    env_file: [.env]
    command: bash -lc "python dashboard/run_dashboard.py"
    expose: [ "8000" ]
    restart: unless-stopped
    volumes: [ "./data:/app" ]
    networks: [ botnet ]


caddy:
  image: caddy:2.8

    container_name: crypto-proxy
    ports: [ "80:80", "443:443" ]
    environment: [ "DOMAIN=${DOMAIN}", "CADDY_EMAIL=${CADDY_EMAIL}" ]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [ dashboard ]
    networks: [ botnet ]

volumes: { caddy_data: {}, caddy_config: {} }
networks: { botnet: { driver: bridge } }


watchdog:
  image: python:3.11-slim
  container_name: crypto-watchdog
  env_file: [.env]
  volumes:
    - ./data:/app
    - /var/run/docker.sock:/var/run/docker.sock
    - ./scripts/watchdog.py:/watchdog.py:ro
  command: ["python", "/watchdog.py"]
  restart: unless-stopped
  depends_on: [ bot, dashboard ]
  networks: [ botnet ]
