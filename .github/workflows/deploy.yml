name: deploy
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Show inputs (non-secret)
        run: |
          echo "RESOURCE_GROUP=${{ vars.RESOURCE_GROUP }}"
          echo "LOCATION=${{ vars.LOCATION }}"
          echo "ACA_ENV_NAME=${{ vars.ACA_ENV_NAME }}"
          echo "APP_NAME=${{ vars.APP_NAME }}"
          echo "ACR_NAME=${{ vars.ACR_NAME }}"
          echo "IMAGE_NAME=${{ vars.IMAGE_NAME }}"
          echo "IMAGE_TAG=${{ vars.IMAGE_TAG }}"
          echo "TARGET_PORT=${{ vars.TARGET_PORT }}"

      - name: Ensure Azure CLI extension
        run: az extension add --name containerapp --upgrade

      - name: Ensure Container Apps environment exists
        run: |
          set -e
          if ! az containerapp env show \
            --name "${{ vars.ACA_ENV_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" >/dev/null 2>&1; then
            echo "Creating Container Apps environment..."
            az containerapp env create \
              --name "${{ vars.ACA_ENV_NAME }}" \
              --resource-group "${{ vars.RESOURCE_GROUP }}" \
              --location "${{ vars.LOCATION }}"
          else
            echo "Environment exists."
          fi

      - name: Create/Update Container App (system-assigned identity)
        run: |
          set -e
          REGISTRY="${{ vars.ACR_NAME }}.azurecr.io"
          IMAGE="${REGISTRY}/${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_TAG }}"

          if az containerapp show \
              --name "${{ vars.APP_NAME }}" \
              --resource-group "${{ vars.RESOURCE_GROUP }}" >/dev/null 2>&1; then
            echo "Updating existing app..."
            az containerapp update \
              --name "${{ vars.APP_NAME }}" \
              --resource-group "${{ vars.RESOURCE_GROUP }}" \
              --image "$IMAGE" \
              --ingress external \
              --target-port "${{ vars.TARGET_PORT }}" \
              --min-replicas 1 \
              --max-replicas 3 \
              --set-env-vars "WEBSITES_PORT=${{ vars.TARGET_PORT }}"
          else
            echo "Creating app..."
            az containerapp create \
              --name "${{ vars.APP_NAME }}" \
              --resource-group "${{ vars.RESOURCE_GROUP }}" \
              --environment "${{ vars.ACA_ENV_NAME }}" \
              --image "$IMAGE" \
              --ingress external \
              --target-port "${{ vars.TARGET_PORT }}" \
              --min-replicas 1 \
              --max-replicas 3 \
              --system-assigned \
              --set-env-vars "WEBSITES_PORT=${{ vars.TARGET_PORT }}"
          fi

      - name: Grant ACR pull to the app's managed identity (idempotent)
        run: |
          set -e
          PRINCIPAL_ID=$(az resource show \
            -g "${{ vars.RESOURCE_GROUP }}" \
            -n "${{ vars.APP_NAME }}" \
            --resource-type Microsoft.App/containerApps \
            --query identity.principalId -o tsv)

          ACR_ID=$(az acr show -n "${{ vars.ACR_NAME }}" --query id -o tsv)

          az role assignment create \
            --assignee "$PRINCIPAL_ID" \
            --role "AcrPull" \
            --scope "$ACR_ID" \
            || echo "Role already assigned."

      - name: Show app URL
        run: |
          az containerapp show \
            --name "${{ vars.APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv
