name: Deploy Aggressive Crypto Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy Container App (Simple Method)
      run: |
        # Simple deployment without problematic parameters
        az containerapp update \
          --name crypto-trading-bot-prod-app \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        
        echo "Container app updated successfully!"

    - name: Configure Environment Variables
      run: |
        # Set environment variables in a separate step
        az containerapp update \
          --name crypto-trading-bot-prod-app \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --replace-env-vars \
            BINANCE_API_KEY="${{ secrets.BINANCE_API_KEY }}" \
            BINANCE_API_SECRET="${{ secrets.BINANCE_API_SECRET }}" \
            NOTIFICATION_EMAIL="${{ secrets.NOTIFICATION_EMAIL }}" \
            INITIAL_CAPITAL="${{ secrets.INITIAL_CAPITAL }}" \
            MAX_RISK_PER_TRADE="${{ secrets.MAX_RISK_PER_TRADE }}" \
            ENVIRONMENT="production" \
            CONFIG_PATH="config/aggressive_production.yaml"
        
        echo "Environment variables configured for aggressive trading!"

    - name: Verify Deployment
      run: |
        echo "Checking container app status..."
        az containerapp show \
          --name crypto-trading-bot-prod-app \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --query "properties.provisioningState" \
          --output tsv
        
        echo "Getting app URL..."
        APP_URL=$(az containerapp show \
          --name crypto-trading-bot-prod-app \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --query "properties.configuration.ingress.fqdn" \
          --output tsv)
        
        echo "App URL: https://$APP_URL"
        echo "Health check: https://$APP_URL/health"
        echo "Status check: https://$APP_URL/status"
        
        echo "🚀 AGGRESSIVE CRYPTO TRADING BOT DEPLOYED!"
        echo "Bot will start trading aggressively within minutes!"

