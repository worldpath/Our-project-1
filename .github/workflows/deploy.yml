name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /opt/crypto-bot/Our-project-1
          git pull origin main
          docker-compose down
          docker-compose up -d --build
          echo "🚀 Professional Crypto Trading System Deployed!"
          echo "💰 Live trading active with institutional risk management"
          docker ps
