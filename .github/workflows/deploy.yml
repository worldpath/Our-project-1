name: Deploy Aggressive Crypto Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        platforms: linux/amd64

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy Container App (Simple Method)
      run: |
        # Simple deployment without problematic parameters
        az containerapp update \
          --name crypto-trading-bot-prod-app \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        
        echo "✅ Container app updated successfully!"

    - name: Configure Environment Variables for Aggressive Trading
      run: |
        # Set environment variables for aggressive trading configuration
        az containerapp update \
          --name crypto-trading-bot-prod-app \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --replace-env-vars \
            BINANCE_API_KEY="${{ secrets.BINANCE_API_KEY }}" \
            BINANCE_API_SECRET="${{ secrets.BINANCE_API_SECRET }}" \
            NOTIFICATION_EMAIL="${{ secrets.NOTIFICATION_EMAIL }}" \
            INITIAL_CAPITAL="${{ secrets.INITIAL_CAPITAL }}" \
            MAX_RISK_PER_TRADE="${{ secrets.MAX_RISK_PER_TRADE }}" \
            ENVIRONMENT="production" \
            CONFIG_PATH="config/aggressive_production.yaml"
        
        echo "✅ Aggressive trading configuration applied!"
        echo "🔥 30% Portfolio Risk | 15% Position Sizes | 8 Concurrent Positions"

    - name: Verify Deployment and Get URLs
      run: |
        echo "🔍 Checking container app status..."
        STATUS=$(az containerapp show \
          --name crypto-trading-bot-prod-app \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --query "properties.provisioningState" \
          --output tsv)
        
        echo "Status: $STATUS"
        
        echo "🌐 Getting app URL..."
        APP_URL=$(az containerapp show \
          --name crypto-trading-bot-prod-app \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --query "properties.configuration.ingress.fqdn" \
          --output tsv)
        
        echo "=================================="
        echo "🚀 AGGRESSIVE CRYPTO TRADING BOT DEPLOYED!"
        echo "=================================="
        echo "App URL: https://$APP_URL"
        echo "Health Check: https://$APP_URL/health"
        echo "Status Check: https://$APP_URL/status"
        echo "=================================="
        echo "⚡ AGGRESSIVE SETTINGS ACTIVE:"
        echo "• 30% Portfolio Risk"
        echo "• 15% Max Position Size"
        echo "• 8 Concurrent Positions"
        echo "• 15-minute Trading Cycles"
        echo "• 10 Crypto Pairs"
        echo "=================================="
        echo "💰 Bot will start trading aggressively within 5 minutes!"
        echo "📧 Daily reports will be sent to your email"
        echo "🌙 24/7 autonomous operation active"
        echo "=================================="
