name: deploy
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Show inputs (non-secret)
        run: |
          echo "RESOURCE_GROUP=${{ vars.RESOURCE_GROUP }}"
          echo "LOCATION=${{ vars.LOCATION }}"
          echo "ACA_ENV_NAME=${{ vars.ACA_ENV_NAME }}"
          echo "APP_NAME=${{ vars.APP_NAME }}"
          echo "ACR_NAME=${{ vars.ACR_NAME }}"
          echo "IMAGE_NAME=${{ vars.IMAGE_NAME }}"
          echo "IMAGE_TAG=${{ vars.IMAGE_TAG }}"
          echo "TARGET_PORT=${{ vars.TARGET_PORT }}"

      - name: Ensure Azure CLI extension
        run: az extension add --name containerapp --upgrade

      - name: Deploy Container App
        run: |
          set -e
          REGISTRY="${{ vars.ACR_NAME }}.azurecr.io"
          IMAGE="$REGISTRY/${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_TAG }}"

          echo "Deploying $IMAGE to Container App ${{ vars.APP_NAME }} in RG ${{ vars.RESOURCE_GROUP }}"

          az containerapp up \
            --name "${{ vars.APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --environment "${{ vars.ACA_ENV_NAME }}" \
            --location "${{ vars.LOCATION }}" \
            --image "$IMAGE" \
            --ingress external \
            --target-port "${{ vars.TARGET_PORT }}" \
            --min-replicas 1 \
            --max-replicas 3 \
            --set-env-vars "WEBSITES_PORT=${{ vars.TARGET_PORT }}"

      - name: Show app URL
        run: |
          az containerapp show \
            --name "${{ vars.APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv
