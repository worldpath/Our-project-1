[supervisord]
nodaemon=false
logfile=/home/user/webapp/logs/supervisord.log
pidfile=/home/user/webapp/logs/supervisord.pid
childlogdir=/home/user/webapp/logs

[unix_http_server]
file=/home/user/webapp/logs/supervisor.sock

[supervisorctl]
serverurl=unix:///home/user/webapp/logs/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:crypto-trading-bot]
command=python3 /home/user/webapp/main.py
directory=/home/user/webapp
autostart=true
autorestart=true
startretries=3
stdout_logfile=/home/user/webapp/logs/crypto_bot.log
stderr_logfile=/home/user/webapp/logs/crypto_bot_error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
user=user
environment=HOME="/home/user",USER="user"
priority=100

[program:crypto-dashboard]
command=python3 dashboard/run_dashboard.py
directory=/home/user/webapp
autostart=true
autorestart=true
startretries=3
stdout_logfile=/home/user/webapp/logs/dashboard.log
stderr_logfile=/home/user/webapp/logs/dashboard_error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
user=user
environment=HOME="/home/user",USER="user",DASHBOARD_PORT="8001",DASHBOARD_USER="admin",DASHBOARD_PASS="crypto2024secure",DASHBOARD_JWT_SECRET="your_jwt_secret_change_me_in_production_2024"
priority=200

[program:health-monitor]
command=python3 /home/user/webapp/health_monitor.py
directory=/home/user/webapp
autostart=true
autorestart=true
startretries=3
stdout_logfile=/home/user/webapp/logs/health_monitor.log
stderr_logfile=/home/user/webapp/logs/health_monitor_error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
user=user
environment=HOME="/home/user",USER="user"
priority=300
