[supervisord]
nodaemon=false
logfile=/home/user/webapp/supervisord.log
pidfile=/home/user/webapp/supervisord.pid

[unix_http_server]
file=/home/user/webapp/supervisor.sock

[supervisorctl]
serverurl=unix:///home/user/webapp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:control_ui]
command=python -m uvicorn main:app --host 0.0.0.0 --port 8000
directory=/home/user/webapp/control_ui/backend
autostart=true
autorestart=true
stdout_logfile=/home/user/webapp/control_ui.log
stderr_logfile=/home/user/webapp/control_ui_error.log
environment=PYTHONPATH="/home/user/webapp:/home/user/webapp/bot_enhancements"