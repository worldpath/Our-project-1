# AGGRESSIVE Production Configuration for Crypto Trading Bot
# ========================================================
# ⚠️  AGGRESSIVE SETTINGS - HIGH RISK, HIGH REWARD
# ========================================================

environment: production
trading_mode: aggressive

# EXECUTION SETTINGS
execution:
  instruments:
    - BTCUSDT
    - ETHUSDT
    - ADAUSDT
    - SOLUSDT
    - MATICUSDT
    - XRPUSDT
    - DOGEUSDT
    - AVAXUSDT
    - DOTUSDT
    - LINKUSDT
  order_type: market
  timeout_seconds: 30

# RISK MANAGEMENT - AGGRESSIVE
risk:
  risk_per_trade: 5.0          # 5% risk per trade

portfolio:
  max_portfolio_heat: 30.0     # 30% portfolio risk
  max_daily_loss: 12.0         # 12% daily loss limit
  max_drawdown: 35.0           # 35% max drawdown
  concurrent_positions: 8      # 8 positions at once

# STRATEGY CONFIGURATION
strategy:
  enabled_strategies:
    - momentum
    - mean_reversion
    - breakout
    - smart_money
    
strategy_params:
  tp2_r: 3.0                   # Take profit 2 ratio

# ROUTING CONFIGURATION
routing:
  momentum: market
  mean_reversion: limit_post_only
  breakout: market
  smart_money: market

per_strategy_risk:
  momentum: 5.0
  mean_reversion: 4.0
  breakout: 6.0
  smart_money: 5.5

# LIMIT POST ONLY SETTINGS
limit_post_only:
  buy_offset_ticks: 1
  max_retries: 3
  retry_sleep_ms: 500

# HYBRID ROUTING
hybrid_routing:
  enabled: true
  adx_threshold: 25

# REPORTING
reporting:
  trade_log_file: trade_history.csv
  
# ALERTS AND NOTIFICATIONS
alerts:
  enabled: true
  email_enabled: true
  telegram_enabled: true
  
# TAX TRACKING
tax_tracking:
  enabled: true
  cost_method: FIFO           # FIFO, LIFO, HIFO
  db_path: tax_data.db
  generate_1099b: true
  
# HEALTH MONITORING
health_monitoring:
  enabled: true
  check_interval_seconds: 60
  retention_days: 30
  alerts_enabled: true
  
# BACKUP SYSTEM
backup:
  enabled: true
  schedule:
    hourly: true
    daily: true
    weekly: true
  retention_days: 30
  compression: true
  
# Features enabled - LIVE TRADING
features:
  live_trading: true           # ⚠️ LIVE TRADING ENABLED ⚠️
  automated_trading: true
  risk_management: true
  tax_tracking: true
  health_monitoring: true
  automated_backups: true
  24_7_operation: true
  performance_analytics: true
